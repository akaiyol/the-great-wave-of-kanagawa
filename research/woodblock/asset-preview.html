<!doctype html><html lang="en"><meta charset="utf-8"><title>Wave asset matte check</title><style>body{margin:0;padding:12px;background:#eee4cd;font:14px system-ui;color:#183d57}main{display:grid;grid-template-columns:1fr 1fr;gap:12px}figure{margin:0}figcaption{padding:6px}section{aspect-ratio:3/2}img{display:block;width:100%;height:100%;object-fit:contain}.paper{background:#f1e2bf}.ink{background:#173d57}</style><main><figure><figcaption>Warm paper</figcaption><section class="paper"><img></section></figure><figure><figcaption>Indigo water</figcaption><section class="ink"><img></section></figure></main><script>const name=new URLSearchParams(location.search).get('asset')||'hero-wave-v2.png';if(!/^[a-z0-9-]+\.png$/.test(name))throw Error('Invalid asset');Promise.all([...document.images].map(im=>{im.src='../../assets/woodblock/'+name;return im.decode()})).then(()=>window.assetPreview={ready:true,asset:name})</script></html>
