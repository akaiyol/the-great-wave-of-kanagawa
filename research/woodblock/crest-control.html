<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Crest contour control</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#e8d7b1;color:#193e58;font:14px system-ui}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:8px;padding:12px 16px;flex-wrap:wrap}button{background:transparent;color:inherit;border:1px solid #193e58;padding:7px 12px;font:inherit;cursor:pointer}button[aria-pressed=true]{background:#193e58;color:#f3eed9}button:focus-visible{outline:3px solid #286384;outline-offset:2px}#status{margin-left:auto}main{min-height:0;flex:1}canvas{display:block;width:100%;height:100%}footer{padding:10px 16px;max-width:1000px;font-size:12px;line-height:1.45}</style></head><body>
<header><button data-mode="vector" aria-pressed="true">Vector control</button><button data-mode="source" aria-pressed="false">Source crop</button><button data-mode="overlay" aria-pressed="false">Overlay</button><span id="status">Loading</span></header><main><canvas aria-label="Source-derived crest contour comparison"></canvas></main><footer>Fixed source-color reconstruction. Paper and foam are not semantically separated. Left and bottom edges are artificial root cuts; this is a crest group, not a whole wave or procedural result.</footer><script type="module" src="crest-control.mjs"></script></body></html>
