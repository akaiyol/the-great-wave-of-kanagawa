<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Canonical crest region study</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e6dcc1;color:#193f56;font:16px system-ui}header{height:74px;padding:12px 24px;display:flex;align-items:center;gap:24px}h1{font-size:20px;margin:0}button{font:inherit;padding:8px 14px}main{display:grid;grid-template-columns:minmax(0,1fr) 350px;height:calc(100vh - 74px)}svg{width:100%;height:100%;background:#d5c8a6}aside{padding:20px;overflow:auto}li{margin-bottom:16px}circle{fill:#f2dc6a;stroke:#193f56;stroke-width:2}text{font:bold 20px system-ui;fill:#102e42;paint-order:stroke;stroke:#fff1c4;stroke-width:4}#overlay[hidden]{display:none}</style>
<header><h1>Canonical crest: filled regions and contour ink</h1><button id="toggle">Show annotations</button><span>Unmodified Met JP1847 scan</span></header>
<main><svg viewBox="1200 280 1000 1050" role="img" aria-label="Canonical crest crop"><image href="../../references/great-wave-off-kanagawa-met-DP130155.jpg" width="3859" height="2594"/><g id="overlay" hidden></g></svg><aside><p>Source-coordinate crop. Labels are observations to review, not a traced generation template.</p><ol id="notes"></ol></aside></main>
<script type="module">const parent=new URLSearchParams(location.search).get('patch')==='parent';if(parent)document.querySelector('svg').setAttribute('viewBox','1900 780 480 500');let visible=false;const overlay=document.querySelector('#overlay');document.querySelector('#toggle').onclick=()=>{visible=!visible;overlay.toggleAttribute('hidden',!visible);document.querySelector('#toggle').textContent=visible?'Hide annotations':'Show annotations';};const response=await fetch(parent?'./source-parent.json':'./source-regions.json');if(response.ok){const data=await response.json();for(const n of data.landmarks??[]){overlay.innerHTML+=`<circle cx="${n.point[0]}" cy="${n.point[1]}" r="12"/><text x="${n.point[0]+18}" y="${n.point[1]-10}">${n.id}</text>`;const li=document.createElement('li');li.textContent=`${n.id}: ${n.observation}`;document.querySelector('#notes').append(li);}}</script></html>
